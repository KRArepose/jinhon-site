const documents={"mission":{"title":"현장 임무 보고서 · 정기 점검 기록","code":"현장기록 2016-10","date":"2016.10.10","body":"문서 구분: 현장 점검 기록\n작성 부서: 지역 지부 합동 점검반\n기록일: 2016.10.10\n\n1. 점검 목적\n기존 이화 발생지에 대한 사후 관측을 실시하고, 봉인 및 진혼 조치 이후 잔류 위험 여부를 확인하기 위함.\n\n2. 점검 내용\n- 현장 출입 통제 상태 및 안전 표지 확인\n- 봉인 지점 주변의 이상 반응 및 잔류 흔적 관측\n- 관계자 진술과 이전 관측 기록 대조\n- 인접 구역에 대한 추가 확산 징후 확인\n\n3. 관측 결과\n점검 구역 일부에서 미약한 잔류 반응이 확인되었으나, 관측 시점에 즉각적인 위해를 유발하는 현상은 확인되지 않음. 반응의 강도와 지속 시간에는 편차가 있어 단일 관측만으로 종식을 판단하기 어려움.\n\n4. 조치 사항\n현장 통제 상태를 유지하고, 관할 지부에 추가 관측을 요청함. 관련 기록은 연구 담당자에게 전달하여 비교 검토 예정.\n\n5. 후속 권고\n정기 점검을 지속하고, 잔류 반응이 증가하거나 새로운 발현 양상이 확인될 경우 즉시 위험도 재평가를 실시할 것.\n\n※ 상세 위치, 참여 인원 및 관련자 정보는 별도 관리 문서에 기록함."},"research":{"title":"이화 특이 현상 관련 조사 협조 요청","code":"조사협조 2016-09","date":"2016.09.05","body":"작성 부서: 한국진혼연맹 서울본부 조사·연구 담당\n수신: 전국 각 지부 현장 담당자 및 조사 책임자\n\n1. 조사 배경\n최근 각지에서 발생한 이화 가운데 기존 관측 기록과 상이한 반응을 보이는 사례가 잇따라 보고되고 있습니다. 특히 이화의 기운이 일정하게 유지되지 않고 급격히 강약을 반복하거나, 진압·봉인 과정에서 예상하지 못한 변동을 보이는 현상이 확인되고 있습니다. 현재까지 공통 원인은 규명되지 않았으며, 단일한 유형의 현상으로 단정하기 어려운 상황입니다.\n\n2. 조사 협조 요청\n이에 각 지부에서는 관할 지역 내 이화 발생 및 대응 과정에서 확인된 특이 사항을 조사하여 관련 보고서를 제출해 주시기 바랍니다. 기존 사건의 사후 점검 중 발견한 이상 반응도 조사 대상에 포함됩니다.\n\n3. 중점 확인 사항\n- 이화의 기운이 불규칙하게 증감하거나 갑작스럽게 변하는지 여부\n- 기존 위험도 분류와 실제 현장 반응 사이의 차이\n- 발생 전후 주변 환경, 인원 및 관측 조건의 변화\n- 진압·봉인 이후 잔류 반응 또는 재발 징후\n- 동일 지역 또는 유사 사례와의 공통점 및 차이점\n\n4. 보고서 작성 및 제출\n관측 일시와 장소, 관측자, 확인된 현상, 실시한 조치 및 후속 경과를 구분하여 기재해 주십시오. 직접 확인한 사실과 관계자 진술, 담당자의 추정은 명확히 구별해야 합니다. 각 지부는 취합한 조사 결과를 서울본부 조사·연구 담당자에게 전달해 주시기 바랍니다. 긴급한 위험이 예상되는 경우에는 정식 보고서 제출에 앞서 즉시 연락해 주십시오.\n\n5. 유의사항\n이번 조사는 현상의 경향을 파악하기 위한 기초 자료 수집 단계입니다. 특이 현상을 확인하기 위해 무리하게 접근하거나 기존 현장 안전수칙을 위반하지 마십시오. 회원 여러분의 적극적인 협조를 부탁드립니다.\n\n한국진혼연맹 서울본부 조사·연구 담당"}};const archivePosts=[{"tag":"공지","date":"2016.09.30","title":"회원 자료실 이용 안내","pinned":true,"body":"한국진혼연맹 사무국에서 안내드립니다.\n\n본 자료실은 연맹 소속 회원의 원활한 업무 수행과 정보 공유를 위해 운영됩니다. 회원 인증을 완료한 이용자에 한하여 게시물 및 첨부 자료의 열람이 가능합니다.\n\n1. 이용 대상\n- 한국진혼연맹 소속 정회원 및 별도 열람 권한을 부여받은 관계자\n- 소속 지부에서 회원 등록 및 계정 확인을 마친 이용자\n\n2. 제공 자료\n- 이화 관련 조사·연구 기록 및 현장 임무 보고서\n- 임무 수행 절차, 안전수칙, 지부별 업무 공지\n- 교육·연수 참고 자료 및 기타 업무 관련 문서\n\n3. 자료 취급 유의사항\n- 게시 자료는 연맹 내부 업무와 교육 목적으로만 이용해 주십시오.\n- 자료의 무단 복제, 외부 배포 및 제3자 제공을 금합니다.\n- 임무 기록에 포함된 개인정보, 현장 위치 및 피해자 관련 사항의 취급에 주의해 주십시오.\n- 계정의 공동 사용을 삼가고, 열람 중 오류가 발생하면 소속 지부 담당자에게 문의해 주십시오.\n\n4. 문의\n자료의 정정·추가 요청 및 열람 권한 관련 문의는 소속 지부를 통해 서울본부 사무국으로 전달해 주시기 바랍니다.\n\n회원 여러분의 협조를 부탁드립니다.\n\n한국진혼연맹 사무국"},{"tag":"공지","date":"2016.10.11","title":"10월 회원 대상 현장 안전수칙 안내","pinned":true,"body":"한국진혼연맹 서울본부 후토부에서 안내드립니다.\n\n10월 중 현장 임무에 참여하는 회원께서는 아래 안전수칙을 숙지하고, 각 지부의 세부 지침을 함께 확인해 주시기 바랍니다.\n\n1. 출동 전 확인 사항\n- 담당 지도관 또는 현장 책임자의 지휘 체계를 확인하십시오.\n- 배정된 임무의 위험 등급, 대상 지역, 집결 장소 및 복귀 예정 시각을 확인하십시오.\n- 개인 보호 장비, 통신 수단, 비상 연락망을 사전에 점검하십시오.\n\n2. 현장 활동 수칙\n- 허가되지 않은 구역에 단독으로 진입하지 마십시오.\n- 이화의 형태나 반응이 사전 보고와 다를 경우 즉시 책임자에게 알리십시오.\n- 민간인의 접근을 우선 통제하고, 부상자 발생 시 구조·의료 지원을 요청하십시오.\n- 현장에서 확인된 기억·감정 관련 이상 징후는 추측을 배제하고 사실 위주로 기록하십시오.\n\n3. 임무 종료 후\n- 현장 이탈 전 인원 점검 및 잔류 위험 여부를 확인하십시오.\n- 이상 반응을 경험한 회원은 경중에 관계없이 소속 지부에 보고하십시오.\n- 현장 기록 및 특이 사항은 정해진 절차에 따라 제출하십시오.\n\n※ 청소년 회원이 동행하는 교육·연수 현장에서는 지정 지도관의 인솔 지침을 우선 적용합니다.\n\n한국진혼연맹 서울본부 후토부"},{"tag":"업무","date":"2016.10.07","title":"지역 지부 임무 보고서 제출 절차 안내","body":"각 지역 지부의 임무 보고서 제출 절차를 다음과 같이 안내드립니다.\n\n1. 제출 대상\n이화 관련 현장 조사, 진압·봉인, 진혼 및 사후 점검에 참여한 임무 책임자 또는 지정 기록 담당자\n\n2. 제출 시기\n원칙적으로 임무 종료 후 3일 이내에 소속 지부에 제출합니다. 긴급 사고 또는 추가 피해 우려가 있는 경우에는 서면 제출에 앞서 즉시 구두 보고해 주십시오.\n\n3. 필수 기재 항목\n- 임무 일시 및 관할 지부\n- 참여 인원과 현장 책임자\n- 이화의 관측 양상 및 잠정 위험 등급\n- 수행 조치, 피해 현황, 잔류 위험 및 후속 조치 필요 여부\n\n4. 제출 경로\n작성자 → 현장 책임자 확인 → 소속 지부 취합 → 서울본부 보고(필요 시)\n\n5. 유의사항\n확인되지 않은 추정은 관측 사실과 구분해 작성하십시오. 피해자 인적 사항 및 민감한 현장 정보는 별도 관리 규정에 따라 처리해 주십시오.\n\n한국진혼연맹 서울본부 사무국"}];function openArchivePost(id){if(!loggedIn){openAccessModal();return}go('archivepost',id)}function openDocument(id){if(!loggedIn){openAccessModal();return}go('document',id)};const app=document.getElementById('app');function openAccessModal(){let m=document.getElementById('access-modal');m.hidden=false;m.style.display='flex' const publishedPosts=[{"tag":"공지","date":"2016.09.20","title":"10월 회원 대상 현장 안전수칙 안내","pinned":true,"body":"한국진혼연맹 서울본부 후토부에서 안내드립니다.\n\n10월 중 현장 임무에 참여하는 회원께서는 아래 안전수칙을 숙지하고, 각 지부의 세부 지침을 함께 확인해 주시기 바랍니다.\n\n1. 출동 전 확인 사항\n- 담당 지도관 또는 현장 책임자의 지휘 체계를 확인하십시오.\n- 배정된 임무의 위험 등급, 대상 지역, 집결 장소 및 복귀 예정 시각을 확인하십시오.\n- 개인 보호 장비, 통신 수단, 비상 연락망을 사전에 점검하십시오.\n\n2. 현장 활동 수칙\n- 허가되지 않은 구역에 단독으로 진입하지 마십시오.\n- 이화의 형태나 반응이 사전 보고와 다를 경우 즉시 책임자에게 알리십시오.\n- 민간인의 접근을 우선 통제하고, 부상자 발생 시 구조·의료 지원을 요청하십시오.\n- 현장에서 확인된 기억·감정 관련 이상 징후는 추측을 배제하고 사실 위주로 기록하십시오.\n\n3. 임무 종료 후\n- 현장 이탈 전 인원 점검 및 잔류 위험 여부를 확인하십시오.\n- 이상 반응을 경험한 회원은 경중에 관계없이 소속 지부에 보고하십시오.\n- 현장 기록 및 특이 사항은 정해진 절차에 따라 제출하십시오.\n\n※ 청소년 회원이 동행하는 교육·연수 현장에서는 지정 지도관의 인솔 지침을 우선 적용합니다.","id":"notice-1","author":"한국진혼연맹 서울본부"},{"id":"doc-research","title":"이화 특이 현상 관련 조사 협조 요청","date":"2016.07.07","tag":"업무","body":"최근 경북 지역에서 발생한 이화 가운데 기존 관측 기록과 상이한 반응을 보이는 사례가 잇따라 보고되고 있습니다.\n\n특히 이화의 기운이 불규칙하게 증감하거나 진압 및 봉인 과정에서 예상하지 못한 변동을 보이는 등, 기존 위험도 분류 기준만으로는 판단하기 어려운 사례가 일부 확인되고 있습니다.\n\n이에 한국진혼연맹에서는 해당 현상의 발생 경향과 공통점을 파악하기 위하여 각 지부의 조사 협조를 요청드립니다.\n\n각 지부에서는 관할 지역 내 이화 발생 및 대응 과정에서 확인된 특이사항을 취합하여 관련 보고서를 제출해 주시기 바랍니다. 기존 사건의 사후 점검 과정에서 발견된 이상 반응 역시 조사 대상에 포함됩니다.\n\n주요 조사 항목은 다음과 같습니다.\n\n1. 이화의 기운이 불규칙하게 증감하거나 급격히 변화하는 현상\n2. 기존 위험도 분류와 실제 현장 반응 사이의 차이\n3. 이화 발생 전후 주변 환경 및 관측 조건의 변화\n4. 진압·봉인 이후 잔류 반응 또는 재발 징후\n5. 동일 지역 및 유사 사례에서 확인되는 공통적인 특이사항\n\n보고서에는 관측 일시와 장소, 확인된 현상, 현장 조치 및 후속 경과를 기재해 주시고, 직접 관측한 사실과 관계자 진술 및 추정 사항은 구분하여 작성해 주시기 바랍니다.\n\n작성된 보고서는 각 지부에서 취합한 후 서울본부 조사·연구 담당자에게 전달해 주시면 됩니다.\n\n현재 해당 현상의 원인은 확인되지 않았으며, 본 조사는 기초 자료 수집을 목적으로 진행됩니다. 조사 과정에서는 기존 현장 안전수칙을 준수하여 주시고, 특이 현상 확인을 위한 무리한 접근이나 단독 행동은 삼가 주시기 바랍니다.\n\n각 지부 및 회원 여러분의 적극적인 협조를 부탁드립니다.","author":"한국진혼연맹 서울본부","pinned":true},{"tag":"공지","date":"2007.03.08","title":"회원 자료실 이용 안내","pinned":true,"body":"본 자료실은 연맹 소속 회원의 원활한 업무 수행과 정보 공유를 위해 운영됩니다. 회원 인증을 완료한 이용자에 한하여 게시물 및 첨부 자료의 열람이 가능합니다.\n\n1. 이용 대상\n- 한국진혼연맹 소속 정회원 및 별도 열람 권한을 부여받은 관계자\n- 소속 지부에서 회원 등록 및 계정 확인을 마친 이용자\n\n2. function save(){try{localStorage.setItem(STORE,JSON.stringify(drafts));localStorage.setItem(REMOVED,JSON.stringify(removed));return true}catch(e){alert('브라우저 저장에 실패했습니다. JSON 내보내기로 백업해 주세요.');return false}}

document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let id=b.dataset.delete;if(!confirm('이 게시글을 임시 목록에서 삭제하시겠습니까?'))return;removed=[...new Set([...removed,id])];delete drafts[id];save();if(editingId===id)editingId=null;editPage()});
document.getElementById('post-editor').onsubmit=e=>{e.preventDefault();let f=e.currentTarget;let id=editingId||'new-'+Date.now()+'-'+Math.floor(Math.random()*100000);let data={id,tag:f.elements.tag.value,title:f.elements.title.value.trim(),date:f.elements.date.value.replaceAll('-','.'),author:'한국진혼연맹 서울본부',body:f.elements.body.value,pinned:f.elements.pinned.checked};if(!data.title||!data.body.trim())return;drafts[id]=data;removed=removed.filter(x=>x!==id);if(save()){editingId=id;editPage();document.getElementById('editor-msg').textContent='임시 저장되었습니다. JSON 파일로 내보내면 다른 기기에서도 복원할 수 있습니다.';document.getElementById('editor-heading').scrollIntoView({behavior:'smooth'})}};
document.getElementById('editor-export').onclick=()=>{let payload={format:'jinhon-archive-draft',version:1,exportedAt:new Date().toISOString(),posts:posts(),removed};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='jinhon_archive_draft.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('editor-import').onclick=()=>document.getElementById('editor-file').click();document.getElementById('editor-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.format!=='jinhon-archive-draft'||data.version!==1||!Array.isArray(data.posts)||!Array.isArray(data.removed))throw Error('형식 불일치');if(!confirm('현재 임시 편집 내용을 불러온 파일로 교체하시겠습니까?'))return;let base=defaults();let next={};for(let p of data.posts){if(!p||typeof p.id!=='string'||typeof p.title!=='string'||typeof p.body!=='string'||typeof p.tag!=='string'||typeof p.date!=='string')throw Error('게시글 데이터 오류');next[p.id]={id:p.id,title:p.title,body:p.body,tag:p.tag==='기타'?'자료':p.tag,date:p.date,author:'한국진혼연맹 서울본부',pinned:!!p.pinned}}drafts=next;removed=data.removed.filter(x=>typeof x==='string');editingId=null;save();editPage();alert('JSON 파일을 불러왔습니다.')}catch(err){alert('파일을 불러올 수 없습니다: '+err.message)}};
}
function archivePage(){if(!loggedIn){originalRender('archive');return}app.innerHTML=section('자료실','ARCHIVE',`<p class="notice" style="margin-top:0">회원 인증 완료 · 자료 열람이 가능합니다.</p><div class="heading" style="margin-top:22px"><h2>자료 목록</h2><span>DOCUMENTS & NOTICES</span></div><div class="list">${posts().map(p=>`<button class="item" data-open-post="${esc(p.id)}"><span class="tag">[${esc(p.tag)}]</span><strong>${p.pinned?'[공지] ':''}${esc(p.title)}</strong><span class="date">${esc(p.date)}</span></button>`).join('')}</div>`);document.querySelectorAll('[data-open-post]').forEach(b=>b.onclick=()=>go('draftpost',b.dataset.openPost))}
function postPage(id){if(!loggedIn){originalRender('archive');return}let p=findPost(id);app.innerHTML=p?section('자료실','MEMBER DOCUMENT',`<article class="article"><span class="tag">${esc(p.tag)}</span><h2>${esc(p.title)}</h2><div class="meta">${esc(p.date)} · 한국진혼연맹 서울본부</div><div class="body editor-preview">${esc(p.body)}</div><button class="back" id="draftpost-back">자료실로 돌아가기</button></article>`):section('자료실','','게시글을 찾을 수 없습니다.');let b=document.getElementById('draftpost-back');if(b)b.onclick=()=>go('archive')}

function newsDefaults(){return [{"id":"4","tag":"안내","date":"2016.09.05","title":"2016년도 하반기 전국 지부 운영회의 개최 안내","body":"한국진혼연맹에서는 2016년도 하반기 주요 사업 및 지부별 운영 현안을 논의하기 위하여 전국 지부 운영회의를 개최할 예정입니다.\n\n이번 회의에서는 상반기 주요 활동 현황을 공유하고, 하반기 교육·연수 일정과 지부 간 협력 업무, 회원 지원 및 현장 운영에 관한 사항을 논의할 계획입니다.\n\n각 지부에서는 회의 참석 대상자 및 주요 건의사항을 사전에 취합하여 서울본부로 전달해 주시기 바랍니다.\n\n회의 일정과 장소 등 세부 사항은 각 지부 담당자를 통하여 별도 안내할 예정입니다.\n\n원활한 회의 진행을 위하여 관계자 여러분의 협조를 부탁드립니다.","author":"한국진혼연맹 서울본부","pinned":true},{"id":"1","tag":"공지","date":"2016.09.15","title":"2016년도 하반기 청소년 합동연수 참가 안내","body":"2016년도 하반기 청소년 합동연수 참가 안내\n\n한국진혼연맹에서는 청소년 회원의 현장 대응 능력 향상과 지부 간 교류를 위하여 2016년도 하반기 청소년 합동연수를 실시합니다.\n\n이번 연수는 이화에 대한 기초 이해를 바탕으로 현장 안전수칙과 대응 절차를 익히고, 다양한 직무 계열의 회원들과 협력하는 경험을 제공하기 위해 마련되었습니다.\n\n참가를 희망하는 회원께서는 아래 내용을 확인하신 후 소속 지부를 통하여 신청해 주시기 바랍니다.\n\n■ 연수 개요\n\n대상: 한국진혼연맹 소속 청소년 회원\n기간: 2016년 11월 중 3박 4일\n장소: 연맹 지정 연수시설 (참가 확정 후 별도 안내)\n주관: 한국진혼연맹 경북지부\n주요 내용: 이화 대응 기초 교육, 현장 안전교육, 직무별 실습 및 합동 훈련\n\n■ 참가 신청\n\n참가를 희망하는 회원은 소속 지부의 담당자를 통하여 신청서를 제출해 주시기 바랍니다.\n\n참가 인원은 각 지부의 신청 현황과 연수시설 수용 규모 등을 고려하여 조정될 수 있으며, 최종 참가 대상자에게는 세부 일정 및 준비사항을 별도로 안내할 예정입니다.\n\n■ 유의사항\n\n청소년 회원은 보호자 동의 및 소속 지부의 참가 승인을 받아야 합니다.\n연수 기간에는 지정된 지도관과 인솔자의 안내에 따라야 합니다.\n개인별 건강 상태 및 활동상 유의사항은 신청 시 담당자에게 미리 알려주시기 바랍니다.\n연수 일정과 교육 내용은 운영 사정에 따라 일부 변경될 수 있습니다.\n참가 신청 및 연수 운영에 관한 문의는 소속 지부 후토부를 통하여 전달해 주시기 바랍니다.\n\n회원 여러분의 많은 관심과 참여를 부탁드립니다.","author":"한국진혼연맹 서울본부","pinned":false},{"id":"3","tag":"안내","date":"2016.06.04","title":"현장 활동 안전관리 지침 재안내","body":"최근 일부 지부에서 현장 활동 중 안전관리 절차가 충분히 이행되지 않은 사례가 확인됨에 따라, 기존 현장 활동 안전관리 지침을 재안내드립니다.\n\n각 지부 및 소속 회원께서는 아래 내용을 숙지하시어 임무 수행 중 안전사고가 발생하지 않도록 유의하여 주시기 바랍니다.\n\n■ 출동 전 확인사항\n\n임무에 배정된 인원 및 현장 책임자를 사전에 확인해 주시기 바랍니다.\n출동 지역의 위험도와 기존 관측 기록을 충분히 숙지해 주십시오.\n개인 보호 장비와 통신 수단의 이상 유무를 확인하고, 비상 연락망을 점검해 주시기 바랍니다.\n미성년 회원이 참여하는 경우 지정된 지도관 또는 인솔자의 동행 여부를 반드시 확인해 주십시오.\n\n■ 현장 활동 시 유의사항\n\n현장 책임자의 승인 없이 임의로 활동 구역을 이탈하거나 단독 행동을 하지 마십시오.\n이화의 발현 형태 및 기운이 사전 관측 내용과 상이할 경우 즉시 현장 책임자에게 보고해 주시기 바랍니다.\n현장 상황에 따라 위험도가 달라질 수 있으므로, 기존 판정 결과만을 근거로 안전 여부를 판단하지 않도록 유의해 주십시오.\n현장 인원 중 부상자 또는 이상 증상을 호소하는 회원이 발생한 경우, 임무 수행보다 인원 보호 및 안전 확보를 우선해 주시기 바랍니다.\n\n■ 임무 종료 후 조치\n\n현장 철수 전 참여 인원의 복귀 여부와 장비 상태를 확인해 주십시오.\n임무 수행 중 확인된 특이사항 및 안전사고 발생 여부는 소속 지부에 보고해 주시기 바랍니다.\n진압 및 봉인이 완료된 현장이라 하더라도 잔류 위험이 확인된 경우에는 임의로 출입 통제를 해제하지 않도록 유의해 주십시오.\n현장 안전관리 지침은 모든 회원의 안전을 확보하기 위한 기본적인 절차입니다. 각 지부에서는 소속 회원에게 관련 내용을 다시 한번 전달하여 주시고, 현장 책임자 및 지도관께서는 임무 수행 전 안전수칙 준수 여부를 확인해 주시기 바랍니다.\n\n아울러 현장 활동 중 기존 지침으로 대응하기 어려운 상황이 발생한 경우에는 무리하게 임무를 진행하지 마시고, 소속 지부를 통하여 필요한 지원을 요청해 주십시오.\n\n회원 여러분의 안전한 현장 활동을 위하여 적극적인 협조를 부탁드립니다.","author":"한국진혼연맹 서울본부","pinned":false},{"id":"2","tag":"소식","date":"2015.06.10","title":"2015년도 하반기 전국 퇴마사 교류회 개최 안내","body":"한국진혼연맹에서는 전국 각지에서 활동하는 퇴마사들의 교류와 화합을 도모하고, 지부 간 유대관계를 증진하기 위하여 2015년도 전국 퇴마사 교류회를 개최합니다.\n\n이번 교류회는 평소 서로 다른 지역에서 활동하는 회원들이 한자리에 모여 현장 경험과 활동 사례를 공유하고, 다양한 직무 계열에 대한 이해를 넓힐 수 있도록 마련되었습니다.\n\n■ 행사 개요\n\n행사명: 2015 한국진혼연맹 전국 퇴마사 교류회\n참가 대상: 한국진혼연맹 소속 회원 및 초청 관계자\n주관: 한국진혼연맹 서울본부\n주요 프로그램: 지부별 활동 소개, 현장 경험 공유, 직무 계열별 교류, 회원 친목 행사\n\n■ 참가 안내\n\n행사 참가를 희망하는 회원께서는 소속 지부를 통하여 참가 의사를 전달해 주시기 바랍니다.\n세부 일정 및 행사 장소는 참가 인원과 운영 여건을 고려하여 추후 안내할 예정입니다.\n이번 교류회가 회원 간 친목을 다지고, 지부와 직무의 구분을 넘어 서로의 경험을 나누는 뜻깊은 자리가 되기를 바랍니다.\n\n회원 여러분의 많은 관심과 참여를 부탁드립니다.","author":"한국진혼연맹 서울본부","pinned":false},{"id":"news-1791879424210-94964","tag":"소식","title":"2014년도 지역사회 안전교육 및 봉사활동 실시","date":"2014.06.02","author":"한국진혼연맹 서울본부","body":"한국진혼연맹은 지난 5월, 전국 각 지부를 중심으로 지역 주민을 위한 안전교육 및 봉사활동을 실시하였습니다.\n\n이번 활동은 지역사회와의 교류를 확대하고, 각종 재난 및 위급 상황에 대한 주민들의 대응 능력을 높이기 위해 마련되었습니다.\n\n안전교육에서는 일상생활에서 발생할 수 있는 위급 상황에 대비하여 기본적인 응급처치 방법과 대피 요령, 긴급 상황 발생 시 신고 및 대응 절차 등을 안내하였습니다. 아울러 지역별 특성을 고려한 안전사고 예방 교육도 함께 진행하였습니다.\n\n교육 종료 후에는 각 지부 소속 회원들이 지역 환경정비와 취약계층 생활 지원 등 다양한 봉사활동에 참여하였으며, 주민들과 소통하는 시간을 가졌습니다.\n\n한국진혼연맹은 지역사회의 안전과 안녕을 위하여 활동하는 단체로서, 현장 임무 수행뿐만 아니라 주민들과 함께하는 다양한 공익활동에도 지속적으로 참여하고 있습니다.\n\n앞으로도 각 지부와의 협력을 바탕으로 지역사회에 실질적인 도움이 될 수 있는 교육 및 봉사활동을 이어 나갈 예정입니다.\n\n이번 활동에 참여해 주신 회원 및 관계자 여러분께 감사드립니다.","pinned":false},{"id":"news-1791879488671-25494","tag":"행사","title":"제51주년 한국진혼연맹 창립기념식 개최","date":"2013.05.03","author":"한국진혼연맹 서울본부","body":"한국진혼연맹은 창립 51주년을 맞아 연맹의 발자취를 돌아보고, 회원 간 화합과 교류를 도모하기 위한 창립기념식을 개최합니다.\n\n이번 기념식은 1962년 연맹 창립 이래 지역사회의 안녕과 이화로 인한 피해 예방을 위해 힘써 온 회원들의 노고를 되새기고, 연맹의 발전에 기여한 관계자들에게 감사의 뜻을 전하고자 마련되었습니다.\n\n■ 행사 개요\n\n행사명: 제51주년 한국진혼연맹 창립기념식\n일시: 2013년 5월 중 (세부 일정 별도 안내)\n장소: 한국진혼연맹 서울본부 행사장\n참석 대상: 전국 지부 소속 회원, 역대 임원 및 초청 관계자\n주관: 한국진혼연맹 서울본부\n\n■ 주요 행사 내용\n\n연맹 창립 51주년 기념식 및 기념사\n연맹 주요 연혁 및 활동 기록 소개\n장기근속 회원 및 유공 회원 공로패 수여\n전국 지부 대표자 및 원로 회원 소개\n회원 교류 및 기념 만찬\n\n■ 참석 안내\n\n기념식 참석을 희망하는 회원께서는 소속 지부를 통하여 참석 의사를 전달해 주시기 바랍니다.\n\n각 지부에서는 참석 예정 인원을 취합하여 서울본부에 전달해 주시고, 행사 진행에 필요한 협조사항이 있을 경우 사전에 문의해 주시기 바랍니다.\n\n세부 일정 및 행사장 이용에 관한 사항은 참석 대상자에게 별도로 안내할 예정입니다.\n\n지난 51년간 한국진혼연맹의 발전을 위해 헌신해 주신 모든 회원 여러분께 깊이 감사드립니다.\n\n뜻깊은 자리에 회원 여러분의 많은 관심과 참석을 부탁드립니다.","pinned":false}]}
function newsPosts(){return newsDefaults().sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||b.date.localeCompare(a.date)||a.title.localeCompare(b.title))}
function newsSave(){try{localStorage.setItem(NEWS_STORE,JSON.stringify(newsDrafts));localStorage.setItem(NEWS_REMOVED,JSON.stringify(newsRemoved));return true}catch(e){alert('저장에 실패했습니다. JSON 파일로 백업해 주세요.');return false}}
function newsList(items){return `<div class="list">${items.map(x=>`<button class="item" data-news-id="${esc(x.id)}"><span class="tag">[${esc(x.tag)}]</span><strong>${x.pinned?'[고정] ':''}${esc(x.title)}</strong><span class="date">${esc(x.date)}</span></button>`).join('')}</div>`}
function newsBind(){document.querySelectorAll('[data-news-id]').forEach(b=>b.onclick=()=>go('newsarticle',b.dataset.newsId))}
function newsPage(){app.innerHTML=section('연맹 소식','NEWS & NOTICE',newsList(newsPosts()));newsBind()}
function newsArticle(id){let a=newsPosts().find(x=>x.id===String(id));app.innerHTML=a?section('연맹 소식','ARTICLE',`<article class="article"><span class="tag">${esc(a.tag)}</span><h2>${esc(a.title)}</h2><div class="meta">한국진혼연맹 서울본부 | ${esc(a.date)}</div><div class="body editor-preview">${esc(a.body)}</div><button class="back" onclick="go('news')">목록으로</button></article>`):section('연맹 소식','','게시글을 찾을 수 없습니다.')}
function newsHome(){const items=newsPosts();app.innerHTML=`<div class="home-head"><div class="wrap"><h1>연맹 소식</h1><span>HOME / NEWS</span></div></div><section class="content wrap"><div class="grid"><div><div class="heading"><h2>공지사항</h2><span>NOTICE</span></div>${newsList(items.filter(a=>a.tag!=='학술'&&a.tag!=='소식'))}</div><div><div class="heading"><h2>보도·연구 소식</h2><span>PRESS & RESEARCH</span></div>${newsList(items.filter(a=>a.tag==='학술'||a.tag==='소식'))}</div></div><div class="quick"><button onclick="go('about')">연맹 연혁<small>HISTORY</small></button><button onclick="go('branches')">본부·지부 안내<small>BRANCHES</small></button><button onclick="go('archive')">자료실<small>ARCHIVE</small></button></div></section>`;newsBind()}
function newsEditor(){if(!loggedIn){go('news');return}let selected=newsEditing?newsPosts().find(a=>a.id===newsEditing):null;app.innerHTML=section('연맹 소식 편집','LOCAL DRAFT EDITOR',`<div class="article"><h2>연맹 소식 임시 편집</h2><p class="editor-note">편집 내용은 이 브라우저에 임시 저장됩니다. 정식 게시하려면 JSON 파일을 내보내 전달해 주세요.</p><div class="editor-tools"><button class="primary" id="news-new">새 게시글 작성</button><button id="news-export">JSON 내보내기</button><button id="news-import">JSON 불러오기</button><input type="file" id="news-file" accept=".json,application/json" hidden><button id="news-back">연맹 소식으로</button></div><div class="editor-list">${newsPosts().map(a=>`<div class="editor-entry"><div><strong>${a.pinned?'[고정] ':''}[${esc(a.tag)}] ${esc(a.title)}</strong><div class="editor-note">${esc(a.date)} · 한국진혼연맹 서울본부</div></div><div class="editor-actions"><button data-news-edit="${esc(a.id)}">수정</button><button data-news-delete="${esc(a.id)}">삭제</button></div></div>`).join('')||'<div class="editor-empty">게시글이 없습니다.</div>'}</div><hr style="margin:28px 0;border:0;border-top:1px solid #e8e4e8"><h2 id="news-form-heading">${selected?'게시글 수정':'새 게시글 작성'}</h2><form class="editor-form" id="news-form"><label>말머리<select name="tag">${['공지','안내','소식','학술','행사','기타'].map(t=>`<option ${selected?.tag===t?'selected':''}>${t}</option>`).join('')}</select></label><label>제목<input name="title" required maxlength="160" value="${esc(selected?.title||'')}"></label><label>작성일<input name="date" type="date" required value="${esc((selected?.date||'2016.10.13').replaceAll('.','-'))}"></label><label>작성자<input value="한국진혼연맹 서울본부" readonly></label><label>본문<textarea name="body" required>${esc(selected?.body||'')}</textarea></label><label class="check"><input type="checkbox" name="pinned" ${selected?.pinned?'checked':''}>상단 고정</label><div class="editor-actions"><button class="primary" type="submit">임시 저장</button><button type="button" id="news-cancel">작성 취소</button></div><p id="news-msg" class="editor-message" role="status"></p></form></div>`);
document.getElementById('news-new').onclick=()=>{newsEditing=null;newsEditor()};document.getElementById('news-cancel').onclick=()=>{newsEditing=null;newsEditor()};document.getElementById('news-back').onclick=()=>go('news');
document.querySelectorAll('[data-news-edit]').forEach(b=>b.onclick=()=>{newsEditing=b.dataset.newsEdit;newsEditor();document.getElementById('news-form-heading').scrollIntoView()});
document.querySelectorAll('[data-news-delete]').forEach(b=>b.onclick=()=>{if(!confirm('이 게시글을 임시 목록에서 삭제하시겠습니까?'))return;newsRemoved=[...new Set([...newsRemoved,b.dataset.newsDelete])];delete newsDrafts[b.dataset.newsDelete];newsEditing=null;newsSave();newsEditor()});
document.getElementById('news-form').onsubmit=e=>{e.preventDefault();let f=e.currentTarget;let id=newsEditing||'news-'+Date.now()+'-'+Math.floor(Math.random()*100000);newsDrafts[id]={id,tag:f.elements.tag.value,title:f.elements.title.value.trim(),date:f.elements.date.value.replaceAll('-','.'),author:'한국진혼연맹 서울본부',body:f.elements.body.value,pinned:f.elements.pinned.checked};newsRemoved=newsRemoved.filter(x=>x!==id);if(newsSave()){newsEditing=id;newsEditor();document.getElementById('news-msg').textContent='임시 저장되었습니다. JSON 파일로 내보내 백업해 주세요.'}};
document.getElementById('news-export').onclick=()=>{let payload={format:'jinhon-news-draft',version:1,exportedAt:new Date().toISOString(),posts:newsPosts(),removed:newsRemoved};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='jinhon_news_draft.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('news-import').onclick=()=>document.getElementById('news-file').click();document.getElementById('news-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(d.format!=='jinhon-news-draft'||d.version!==1||!Array.isArray(d.posts)||!Array.isArray(d.removed))throw Error('형식 불일치');if(!confirm('기존 연맹 소식 임시 편집 내용을 불러온 파일로 교체하시겠습니까?'))return;let next={};for(let a of d.posts){if(!a||typeof a.id!=='string'||typeof a.title!=='string'||typeof a.body!=='string'||typeof a.tag!=='string'||typeof a.date!=='string')throw Error('게시글 데이터 오류');next[a.id]={...a,author:'한국진혼연맹 서울본부',pinned:!!a.pinned}}newsDrafts=next;newsRemoved=d.removed.filter(x=>typeof x==='string');newsEditing=null;newsSave();newsEditor();alert('연맹 소식 JSON을 불러왔습니다.')}catch(err){alert('파일을 불러올 수 없습니다: '+err.message)}}
}
render=function(p='home',id){const active=({newsarticle:'news',draftpost:'archive',archivepost:'archive',document:'archive',editor:'archive',newseditor:'news'})[p]||p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===active));if(p==='archive')return archivePage();if(p==='editor')return archivePage();if(p==='draftpost')return postPage(id);if(p==='news')return newsPage();if(p==='newsarticle')return newsArticle(id);if(p==='newseditor')return newsPage();if(p==='home')return newsHome();return originalRender(p,id)};
const oldLogout=logout;logout=function(){editingId=null;newsEditing=null;oldLogout();if(['editor','newseditor'].includes(location.hash.slice(1)))go('home')};
fromHash();
})();
</script></body></html>
